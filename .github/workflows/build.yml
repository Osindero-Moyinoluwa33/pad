name: Build PS WebPad APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange Android Project Structure & Build
        run: |
          mkdir -p app/src/main/java/com/vendapos/pswebpad
          mkdir -p app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml app/src/main/assets
          cp *.kt app/src/main/java/com/vendapos/pswebpad/ 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp bg_*.xml ic_*.xml app/src/main/res/drawable/ 2>/dev/null || true
          cp method.xml app/src/main/res/xml/ 2>/dev/null || true
          cp *.html app/src/main/assets/ 2>/dev/null || true
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PSWebPadHost"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          PKG=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml || echo "com.vendapos.pswebpad")
          mkdir -p "app/src/main/java/${PKG//.//}"
          cp *.kt "app/src/main/java/${PKG//.//}/" 2>/dev/null || true
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "$PKG"
              compileSdk = 34
              defaultConfig {
                  applicationId = "$PKG"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.java-websocket:Java-WebSocket:1.5.6")
          }
          EOF
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps-webpad-host-apk
          path: app/build/outputs/apk/debug/app-debug.apk
