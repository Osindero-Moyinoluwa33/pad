name: Build PS WebPad APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange Android Project Structure & Build
        run: |
          PKG=$(grep -oP 'package="\K[^"]+' AndroidManifest.xml 2>/dev/null || echo "com.vendapos.pswebpad")
          PKG_PATH="app/src/main/java/${PKG//.//}"
          mkdir -p "$PKG_PATH" app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml app/src/main/assets

          cp *.kt "$PKG_PATH/" 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true
          cp activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
          cp bg_*.xml ic_*.xml app/src/main/res/drawable/ 2>/dev/null || true
          cp method.xml app/src/main/res/xml/ 2>/dev/null || true
          cp *.html app/src/main/assets/ 2>/dev/null || true

          # Remove package attribute from Manifest if AGP 8+ namespace is used
          sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml

          # Fallback strings & theme so resource linking never fails
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PS WebPad Host</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.PSWebPadHost" parent="Theme.Material3.Dark.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PSWebPadHost"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "$PKG"
              compileSdk = 34
              defaultConfig {
                  applicationId = "$PKG"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.java-websocket:Java-WebSocket:1.5.6")
          }
          EOF

          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ps-webpad-host-apk
          path: app/build/outputs/apk/debug/app-debug.apk
